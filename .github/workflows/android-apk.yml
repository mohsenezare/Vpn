name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', '*.gradle', 'gradle.properties', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['app/**', 'tests/**', '*.gradle', 'gradle.properties', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - name: Install Android NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build official sing-box libbox (arm64)
        run: |
          export PATH="$HOME/go/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          gomobile init
          git clone --depth=1 --branch v1.12.22 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          test "$(git rev-parse HEAD)" = "f63091d14d8984d53dc9a5563cb72af978b9779e"
          gomobile bind -ldflags=-checklinkname=0 -target=android/arm64 -androidapi=26 -javapkg=io.nekohasekai -libname=box \
            -tags="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api" \
            ./experimental/libbox/
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          unzip -l "$GITHUB_WORKSPACE/app/libs/libbox.aar" | grep 'arm64-v8a/libbox.so'
      - name: Test feed parsers
        run: |
          javac -d /tmp/parser-tests app/src/main/java/com/aegis/vpn/FeedParser.java tests/FeedParserTest.java
          java -cp /tmp/parser-tests com.aegis.vpn.FeedParserTest
          javac -d /tmp/parser-tests app/src/main/java/com/aegis/vpn/TrafficMeter.java tests/TrafficMeterTest.java
          java -cp /tmp/parser-tests com.aegis.vpn.TrafficMeterTest
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package complete source code, dependencies and APK
        run: |
          set -euo pipefail
          export BUNDLE_DIR="$RUNNER_TEMP/AegisVPN-v0.5.4-FULL"
          mkdir -p "$BUNDLE_DIR/app/libs" "$BUNDLE_DIR/builds" "$BUNDLE_DIR/third_party/sing-box-v1.12.22"
          git archive HEAD | tar -xf - -C "$BUNDLE_DIR"
          cp app/libs/libbox.aar "$BUNDLE_DIR/app/libs/libbox.aar"
          cp app/build/outputs/apk/debug/app-debug.apk "$BUNDLE_DIR/builds/AegisVPN-v0.5.4-arm64-debug.apk"
          tar -C /tmp/sing-box --exclude=.git -cf - . | tar -C "$BUNDLE_DIR/third_party/sing-box-v1.12.22" -xf -
          cat > "$BUNDLE_DIR/START_HERE.txt" <<'BUNDLE_GUIDE'
          AEGIS VPN 0.5.4 - COMPLETE SOURCE BUNDLE
          =========================================
          app/src/                  Android Java and resources
          app/src/main/AndroidManifest.xml   App permissions and services
          app/libs/libbox.aar       Exact arm64 native sing-box library used by APK
          builds/*.apk              Built Android debug app (arm64)
          third_party/sing-box-v1.12.22/  Upstream sing-box v1.12.22 Go source for the native engine
          tests/                    Feed parsing and throughput unit tests
          scripts/ and feeds/       Source and OpenVPN public directory utilities
          .github/workflows/        Reproducible build and refresh workflows
          *.gradle, gradle.properties, settings.gradle  Android build configuration
          README.md                 Original project README and version change notes

          Build: Install Android SDK 36, Android Gradle Plugin/Gradle tooling,
          JDK 17, then run gradle :app:assembleDebug from the root directory.
          app/libs/libbox.aar is included so building the APK does not require
          re-running Go gomobile. The original GitHub Actions workflow shows
          how to rebuild libbox from the pinned upstream commit.
          Internet access is still required for Gradle/Maven dependencies
          unless those dependencies are already cached.

          LICENSE NOTE: The bundled upstream sing-box source and libbox library
          are governed by their own upstream GPL-3.0-or-later license; see
          third_party/sing-box-v1.12.22/LICENSE. Respect all relevant notices.
          This is a debug APK; physical-device network operation is not guaranteed.
          BUNDLE_GUIDE
          cd "$RUNNER_TEMP"
          zip -q -r "$GITHUB_WORKSPACE/AegisVPN-v0.5.4-FULL-SOURCE.zip" AegisVPN-v0.5.4-FULL
          unzip -tq "$GITHUB_WORKSPACE/AegisVPN-v0.5.4-FULL-SOURCE.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: AegisVPN-v0.5.4-FULL-SOURCE
          path: AegisVPN-v0.5.4-FULL-SOURCE.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AegisVPN-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish downloadable debug APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk AegisVPN-v0.5.4-arm64-debug.apk
          gh release create "$tag" AegisVPN-v0.5.4-arm64-debug.apk --target "$GITHUB_SHA" --prerelease --title "Aegis VPN 0.5.4 · build ${GITHUB_RUN_NUMBER}" --notes "Debug APK. OpenVPN requires OpenVPN for Android; Embedded sing-box native tunnel for VLESS/VMess/Trojan/SS/Hysteria2; Home screen smart V2Ray/OpenVPN selector; live device-wide network rates (not VPN-only), enhanced glass cards; notification drawer shortcut and user-installable Quick Settings tile; no Telegram or NapsternetV. Connection on your ISP has not been verified."
