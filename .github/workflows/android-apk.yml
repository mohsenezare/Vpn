name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', '*.gradle', 'gradle.properties', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test feed parsers
        run: |
          javac -d /tmp/parser-tests app/src/main/java/com/aegis/vpn/FeedParser.java tests/FeedParserTest.java
          java -cp /tmp/parser-tests com.aegis.vpn.FeedParserTest
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AegisVPN-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish downloadable debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk AegisVPN-v0.4-debug.apk
          gh release create "$tag" AegisVPN-v0.4-debug.apk --target "$GITHUB_SHA" --prerelease --title "Aegis VPN 0.4 · build ${GITHUB_RUN_NUMBER}" --notes "Debug APK. OpenVPN requires OpenVPN for Android; V2Ray configs import into v2rayNG; Telegram proxies and NapsternetV file posts open externally. Connection on your ISP has not been verified."
