name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', '*.gradle', 'gradle.properties', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['app/**', 'tests/**', '*.gradle', 'gradle.properties', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - name: Install Android NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build official sing-box libbox (arm64)
        run: |
          export PATH="$HOME/go/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          gomobile init
          git clone --depth=1 --branch v1.12.22 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          test "$(git rev-parse HEAD)" = "f63091d14d8984d53dc9a5563cb72af978b9779e"
          gomobile bind -ldflags=-checklinkname=0 -target=android/arm64 -androidapi=26 -javapkg=io.nekohasekai -libname=box \
            -tags="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api" \
            ./experimental/libbox/
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          unzip -l "$GITHUB_WORKSPACE/app/libs/libbox.aar" | grep 'arm64-v8a/libbox.so'
      - name: Verify original V5 app preservation
        run: python3 tests/verify_v5_baseline.py
      - name: Test feed parsers
        run: |
          javac -d /tmp/parser-tests app/src/main/java/com/aegis/vpn/FeedParser.java tests/FeedParserTest.java
          java -cp /tmp/parser-tests com.aegis.vpn.FeedParserTest
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AegisVPN-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish downloadable debug APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk AegisVPN-v0.15.0-arm64-debug.apk
          gh release create "$tag" AegisVPN-v0.15.0-arm64-debug.apk --target "$GITHUB_SHA" --prerelease --title "Aegis VPN 0.15.0 · build ${GITHUB_RUN_NUMBER}" --notes "Two modes only: original build-25 native engine and manual V2Ray. Original native engine, discovery, parser, probing, refresh, profile storage, OpenVPN fallback and connection orchestration restored. Glass UI; removed Telegram, backup and stats interfaces. Public nodes require on-device verification." || echo "Release publishing unavailable (GitHub App permissions); APK artifact was successfully uploaded."
