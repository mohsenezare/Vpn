name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', '*.gradle', 'gradle.properties', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['app/**', 'tests/**', '*.gradle', 'gradle.properties', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - name: Install Android NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build official sing-box libbox (arm64)
        run: |
          export PATH="$HOME/go/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.8
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.8
          gomobile init
          git clone --depth=1 --branch v1.12.22 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          test "$(git rev-parse HEAD)" = "f63091d14d8984d53dc9a5563cb72af978b9779e"
          cp "$GITHUB_WORKSPACE/app/native/aegis_latency.go" experimental/libbox/aegis_latency.go
          gomobile bind -ldflags=-checklinkname=0 -target=android/arm64 -androidapi=26 -javapkg=io.nekohasekai -libname=box \
            -tags="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api" \
            ./experimental/libbox/
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          unzip -l "$GITHUB_WORKSPACE/app/libs/libbox.aar" | grep 'arm64-v8a/libbox.so'
      - name: Test feed parsers
        run: |
          javac -d /tmp/parser-tests app/src/main/java/com/aegis/vpn/FeedParser.java tests/FeedParserTest.java
          java -cp /tmp/parser-tests com.aegis.vpn.FeedParserTest
          javac -d /tmp/parser-tests app/src/main/java/com/aegis/vpn/TrafficMeter.java tests/TrafficMeterTest.java
          java -cp /tmp/parser-tests com.aegis.vpn.TrafficMeterTest
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AegisVPN-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build x86_64 core for emulator smoke test
        run: |
          export PATH="$HOME/go/bin:$PATH"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cd /tmp/sing-box
          gomobile bind -ldflags=-checklinkname=0 -target=android/amd64 -androidapi=26 -javapkg=io.nekohasekai -libname=box \
            -tags="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api" ./experimental/libbox/
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
          cd "$GITHUB_WORKSPACE"
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native test worker on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant com.aegis.vpn android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w com.aegis.vpn.test/com.aegis.vpn.ProbeSmokeInstrumentation > /tmp/probe-smoke.txt
            cat /tmp/probe-smoke.txt
            adb logcat -d -s AndroidRuntime GoLog libc System.err
            grep -q 'PROBE_SMOKE_PASSED' /tmp/probe-smoke.txt
