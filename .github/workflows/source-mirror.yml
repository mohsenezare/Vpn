name: Refresh public configuration sources
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/refresh_sources.py', 'scripts/refresh_openvpn.py', '.github/workflows/source-mirror.yml']
permissions:
  contents: write
concurrency:
  group: public-feed-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh_sources.py
      - name: Refresh VPN Gate public mirror (best effort)
        run: python scripts/refresh_openvpn.py
      - name: Preserve latest public feeds
        run: |
          git config user.name 'Aegis source updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh public configuration cache'
          git pull --rebase origin main
          git push origin HEAD:main
